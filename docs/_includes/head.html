<head>
  <meta charset="utf-8">
  <meta name="title" content="{{ page.title }}">
  <meta name="description" content="NCAR ADF Diagnostics Framework">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta class="foundation-mq">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <link rel="shortcut icon" href="{{ 'assets/koru-base/img/app-favicons/ncar/favicon.ico' | relative_url }}">
  <title>{{ page.title }} | {{ site.title }}</title>

  <link rel="stylesheet" href="{{ 'assets/koru-base/lib/fontawesome/css/all.min.css' | relative_url }}" media="all">
  <link rel="stylesheet" href="{{ 'assets/koru-base/lib/icomoon/style.css' | relative_url }}" media="all">
  <link rel="stylesheet" href="{{ 'assets/koru-base/css/foundation.min.css' | relative_url }}" media="all">
  <link rel="stylesheet" href="{{ 'assets/koru-base/css/main.min.css' | relative_url }}" media="all">
  <link rel="stylesheet" href="{{ 'assets/css/styles.css' | relative_url }}" media="all">
  <style>
    .main-nav .menu.icons.icon-left > li > a,
    .main-nav .menu.icons.icon-left > li > .menu-parent {
      display: inline-block;
      color: #fff;
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
      cursor: default;
    }
    .main-nav .menu.icons.icon-left > li > a:hover,
    .main-nav .menu.icons.icon-left > li > .menu-parent:hover {
      color: #fff;
    }
    .submenu-placeholder {
      display: none !important;
    }
    .main-nav .menu > li {
      position: relative;
    }
    .main-nav .menu > li > .menu {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 10;
      min-width: 200px;
      width: auto !important;
      min-width: max-content !important;
      display: block !important;
      padding: 0.5rem;
      white-space: nowrap;
    }
    .main-nav .custom-main-menu > li {
      position: relative;
    }
    .main-nav .custom-main-menu li > ul.menu {
      display: none !important;
      position: absolute !important;
      top: 100% !important;
      left: 0 !important;
      z-index: 10 !important;
      min-width: max-content !important;
      width: auto !important;
      padding: 0.5rem !important;
      white-space: nowrap !important;
      background-color: #fff !important;
      box-shadow: 0 10px 20px rgba(0,0,0,.15) !important;
    }
    .main-nav .custom-main-menu li:hover > ul.menu {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      height: auto !important;
      max-height: none !important;
    }
    .main-nav .menu .menu li a {
      text-align: left !important;
      padding-left: 1.5rem !important;
      margin-left: 0 !important;
      white-space: nowrap;
      display: block;
    }
    .main-nav .menu .menu li {
      list-style-position: inside;
      margin-left: 0 !important;
    }
    .page-sidebar {
      float: left;
      width: 20%;
      margin-right: 20px;
      margin-bottom: 20px;
      padding: 1rem;
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .page-sidebar h4 {
      margin-top: 0;
      font-size: 1.1rem;
    }
    .page-sidebar ul {
      list-style-position: inside;
      padding-left: 0;
    }
    .page-sidebar li {
      margin: 0.5rem 0;
    }
    .page-sidebar a {
      color: #0969da;
      text-decoration: none;
    }
    .page-sidebar a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics }}"></script>
  <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.analytics }}');
  </script>
</head>
